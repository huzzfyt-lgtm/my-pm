<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f12" />
  <title>my-pm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- =================== SIDEBAR =================== -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        </button>
        <span class="brand">my-pm</span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" data-action="today">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>
          <span class="nav-label">Today</span>
        </button>
        <button class="nav-item" data-action="focus">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6"/><circle cx="10" cy="10" r="2"/></svg>
          <span class="nav-label">Focus</span>
        </button>
        <button class="nav-item" data-action="cheatsheet">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 3 1.7c-.7.4-1 .8-1 1.5M10 14h.01"/></svg>
          <span class="nav-label">Shortcuts</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-section-head">
          <span class="nav-label">Projects</span>
          <button id="new-project-btn" class="icon-btn tiny" title="New project" aria-label="New project">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 4v12M4 10h12"/></svg>
          </button>
        </div>
        <div id="project-list" class="project-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-head">
          <span class="nav-label">Tags</span>
        </div>
        <div id="tag-list" class="tag-list"></div>
      </div>
    </aside>

    <!-- =================== MAIN =================== -->
    <main id="main" class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="mobile-menu" aria-label="Menu">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          </button>
          <h1 id="view-title" class="view-title">Today</h1>
          <span id="view-subtitle" class="view-subtitle"></span>
        </div>
        <div class="topbar-right">
          <button id="active-tag" class="tag-pill hidden" title="Clear tag filter"></button>
          <button id="bell-btn" class="icon-btn" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8a5 5 0 0 1 10 0v4l1 2H4l1-2V8z"/><path d="M8 16a2 2 0 0 0 4 0"/></svg>
            <span id="bell-badge" class="badge hidden">0</span>
          </button>
          <button id="today-panel-btn" class="icon-btn" title="Today panel" aria-label="Today panel">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M3 7h14"/></svg>
          </button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>

    <!-- =================== TODAY / WORK BLOCK PANEL =================== -->
    <aside id="today-panel" class="today-panel">
      <div class="panel-head">
        <span class="panel-title">Today</span>
        <button id="new-block-btn" class="btn ghost tiny">+ Block</button>
      </div>
      <div id="work-blocks" class="work-blocks"></div>
    </aside>
  </div>

  <!-- =================== FLOATING QUICK CAPTURE =================== -->
  <button id="quick-capture" class="fab" title="Quick capture (N)" aria-label="Quick capture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- =================== MODAL ROOT =================== -->
  <div id="modal-root"></div>

  <!-- =================== TOAST ROOT =================== -->
  <div id="toast-root"></div>

  <!-- =================== FOCUS OVERLAY =================== -->
  <div id="focus-mode" class="focus-mode hidden">
    <button id="focus-exit" class="btn ghost focus-exit">Exit focus (F / Esc)</button>
    <div id="focus-content" class="focus-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</body>
</html>
