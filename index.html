<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111114" />
  <title>my-pm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- =================== SIDEBAR =================== -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
        </button>
        <span class="brand" id="brand-label">my-pm</span>
      </div>
      <div class="sidebar-body" id="sidebar-body"></div>
    </aside>

    <!-- =================== MAIN =================== -->
    <main id="main" class="main">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="mobile-menu" aria-label="Menu">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          </button>
          <h1 id="view-title" class="view-title">Today</h1>
          <span id="view-subtitle" class="view-subtitle"></span>
        </div>
        <div class="topbar-right" id="topbar-right">
          <button id="active-tag" class="tag-pill hidden" title="Clear tag filter"></button>
          <button id="bell-btn" class="icon-btn" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8a5 5 0 0 1 10 0v4l1 2H4l1-2V8z"/><path d="M8 16a2 2 0 0 0 4 0"/></svg>
            <span id="bell-badge" class="badge hidden">0</span>
          </button>
          <button id="aux-btn" class="icon-btn" title="Right panel" aria-label="Right panel">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M13 3v14"/></svg>
          </button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <!-- =================== AUX PANEL (Today work blocks) =================== -->
    <aside id="aux-panel" class="aux-panel">
      <div class="panel-head">
        <span class="panel-title">Today</span>
        <button id="new-block-btn" class="btn ghost tiny">+ Block</button>
      </div>
      <div id="work-blocks" class="work-blocks"></div>
    </aside>

    <!-- =================== DOCK =================== -->
    <nav id="dock" class="dock" aria-label="App sections">
      <button class="dock-item active" data-section="tasks" title="Tasks">
        <div class="dock-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6l2 2 4-4M5 12l2 2 4-4M14 7h2M14 13h2"/></svg>
        </div>
        <span class="dot"></span>
      </button>
      <button class="dock-item" data-section="notes" title="Notes">
        <div class="dock-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h10v14H5z"/><path d="M8 7h4M8 10h4M8 13h3"/></svg>
        </div>
        <span class="dot"></span>
      </button>
      <button class="dock-item" data-section="lists" title="Lists">
        <div class="dock-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="1.4"/><circle cx="6" cy="10" r="1.4"/><circle cx="6" cy="14" r="1.4"/><path d="M10 6h6M10 10h6M10 14h6"/></svg>
        </div>
        <span class="dot"></span>
      </button>
      <button class="dock-item disabled" data-section="calendar" title="Calendar (coming soon)">
        <div class="dock-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>
        </div>
        <span class="dot"></span>
      </button>
      <button class="dock-item" data-section="settings" title="Settings">
        <div class="dock-icon">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="3"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
        </div>
        <span class="dot"></span>
      </button>
    </nav>
  </div>

  <!-- =================== FLOATING QUICK CAPTURE =================== -->
  <button id="quick-capture" class="fab" title="Quick capture (N)" aria-label="Quick capture">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- =================== MODAL + TOAST + FOCUS =================== -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="dropdown-root"></div>

  <div id="focus-mode" class="focus-mode hidden">
    <button id="focus-exit" class="btn ghost focus-exit">Exit focus (F / Esc)</button>
    <div id="focus-content" class="focus-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js" defer></script>
</body>
</html>
